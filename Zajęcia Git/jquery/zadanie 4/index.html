<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zdarzenie click</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    
  </style>

    <script>
    $(function() {
        
        $("#naKoniec").click(function(){
            let wpisanyProdukt = $("#produkt").val();

            if(wpisanyProdukt.length > 0){
            $("ul").append('<li>' + wpisanyProdukt +'</li>');
            $("li").last().css("color", "blue");
            $("input").val("");
            //alterantywny sposób $("ul").append(`<li> + ${wpisanyProdukt} </li>`);
            }
        })

        $("#naPoczatek").click(function(){
            let wpisanyProdukt = $("#produkt").val();

            if(wpisanyProdukt.length > 0){
            $("ul").prepend('<li>' + wpisanyProdukt +'</li>');
            $("li").first().css({
                "color":"green",
                "font-weight":"bold"
            });
            $("input").val("");
            //alterantywny sposób $("ul").append(`<li> + ${wpisanyProdukt} </li>`);
            }
        })

        $("#accept").change(function(){
            if(this.checked){
                $("#send").removeAttr('disabled')
            }else{
                $("#send").attr("disabled", "disabled");
            }
        })

        })
    </script>

</head>
<body>

    <ul id="lista">
    <li>Chleb</li>
    <li>Mleko</li>
    </ul>
    <input type="text" id="produkt" placeholder="Nazwa produktu">
    <button id="naKoniec">Dodaj na koniec</button>
    <button id="naPoczatek">Dodaj na początek</button>

    <input type="checkbox" id="accept">
    <label for="accept">czy akceptujesz?</label>
    <button id="send" disabled>wyślij</button>

</body>
</html>
